<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Create your CodeQuiz account — join the AI-powered programming quiz platform. Learn from an AI tutor and test your coding knowledge.">
    <title>CodeQuiz - Sign Up</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-card">
        <h1 class="auth-logo" style="display: flex; align-items: center; justify-content: center;">
            <img src="assets/logo.svg" alt="CodeQuiz Logo" width="36" height="36" style="border-radius:8px; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.4); margin-right: 10px;"> CodeQuiz
        </h1>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Sign up to start your coding journey</p>

        <div id="error-msg" class="auth-error" style="display:none;"></div>

        <form id="signup-form">
            <div class="auth-input-group">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <label for="email" class="sr-only">Email Address</label>
                <input type="email" id="email" placeholder="Email Address" required>
            </div>
            <div class="auth-input-group auth-password-group">
                <i class="fas fa-lock" aria-hidden="true"></i>
                <label for="password" class="sr-only">Password</label>
                <div class="password-field">
                    <input type="password" id="password" placeholder="Password (min 6 chars)" required minlength="6">
                    <button type="button" class="password-toggle" id="password-toggle" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="auth-input-group auth-password-group">
                <i class="fas fa-shield-alt" aria-hidden="true"></i>
                <label for="confirm-password" class="sr-only">Confirm Password</label>
                <div class="password-field">
                    <input type="password" id="confirm-password" placeholder="Confirm Password" required minlength="6">
                    <button type="button" class="password-toggle" id="confirm-password-toggle" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div id="password-match-msg" class="password-status" aria-live="polite"></div>
            </div>
            <button type="submit" class="auth-btn" id="signup-btn">
                <span>Sign Up</span>
                <i class="fas fa-user-plus"></i>
            </button>
        </form>

        <p class="auth-switch">
            Already have an account? <a href="login.html">Login</a>
        </p>
    </div>

    <script type="module">
        import { auth } from "./js/firebase.js";
        import {
            createUserWithEmailAndPassword,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // If already logged in, go to quiz
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = "index.html";
        });

        const form = document.getElementById("signup-form");
        const errorMsg = document.getElementById("error-msg");
        const signupBtn = document.getElementById("signup-btn");
        const passwordInput = document.getElementById("password");
        const confirmPasswordInput = document.getElementById("confirm-password");
        const passwordMatchMsg = document.getElementById("password-match-msg");

        function setupPasswordToggle(inputId, buttonId) {
            const input = document.getElementById(inputId);
            const toggle = document.getElementById(buttonId);

            if (!input || !toggle) return;

            toggle.addEventListener("click", () => {
                const isPasswordHidden = input.type === "password";
                input.type = isPasswordHidden ? "text" : "password";
                toggle.innerHTML = isPasswordHidden
                    ? '<i class="fas fa-eye-slash"></i>'
                    : '<i class="fas fa-eye"></i>';
                toggle.setAttribute("aria-label", isPasswordHidden ? "Hide password" : "Show password");
            });
        }

        function validateConfirmPassword() {
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!confirmPassword) {
                passwordMatchMsg.textContent = "";
                passwordMatchMsg.className = "password-status";
                confirmPasswordInput.classList.remove("is-invalid", "is-valid");
                return false;
            }

            if (password !== confirmPassword) {
                passwordMatchMsg.textContent = "Passwords do not match.";
                passwordMatchMsg.className = "password-status error";
                confirmPasswordInput.classList.add("is-invalid");
                confirmPasswordInput.classList.remove("is-valid");
                return false;
            }

            passwordMatchMsg.textContent = "Passwords match.";
            passwordMatchMsg.className = "password-status success";
            confirmPasswordInput.classList.add("is-valid");
            confirmPasswordInput.classList.remove("is-invalid");
            return true;
        }

        setupPasswordToggle("password", "password-toggle");
        setupPasswordToggle("confirm-password", "confirm-password-toggle");
        [passwordInput, confirmPasswordInput].forEach((input) => {
            input.addEventListener("input", validateConfirmPassword);
        });

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.style.display = "none";

            const email = document.getElementById("email").value;
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (password !== confirmPassword) {
                errorMsg.textContent = "Passwords do not match.";
                errorMsg.style.display = "block";
                validateConfirmPassword();
                return;
            }

            signupBtn.disabled = true;
            signupBtn.innerHTML = '<span>Creating account...</span> <i class="fas fa-spinner fa-spin"></i>';

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                window.location.href = "index.html";
            } catch (error) {
                errorMsg.textContent = getErrorMessage(error.code);
                errorMsg.style.display = "block";
                signupBtn.disabled = false;
                signupBtn.innerHTML = '<span>Sign Up</span> <i class="fas fa-user-plus"></i>';
            }
        });

        function getErrorMessage(code) {
            switch (code) {
                case "auth/email-already-in-use": return "Email already registered. Try logging in.";
                case "auth/invalid-email": return "Invalid email address.";
                case "auth/weak-password": return "Password must be at least 6 characters.";
                default: return "Sign up failed. Please try again.";
            }
        }
    </script>
</body>

</html>
